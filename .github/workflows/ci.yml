name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      # Fails if any colour pairing drops below WCAG AA, or if tokens.json changed without the
      # generated files (global.css, lib/theme.ts, web.css, DESIGN.md, …) being rebuilt and committed.
      - name: Tokens are built and pass the contrast gate
        run: npm run tokens:check

      - name: Token build tests
        run: npm run test:tokens

      # Every ui/kit file is registered and exports what registry/components.ts says, and the
      # generated DESIGN_SYSTEM.md tables, llms.txt and registry.json are committed.
      - name: Registry is consistent and generated docs are current
        run: npm run registry:build -- --check

      # The published shadcn registry reinstalls every component and lib file identically.
      - name: Registry builds and round-trips
        run: npm run registry:dist && npm run registry:roundtrip

      - name: Web bundle builds
        run: npm run export:web
