<!doctype html>
<html lang="%LANG_ISO_CODE%" class="bg-background">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Theme before first paint. The bundle loads after this page has painted, so without this a dark
      start shows a white page first. Mirrors KitThemeProvider (lib/theme-context.tsx) and lib/embed.ts:
      ?theme= wins, an embedded page ignores the saved choice, otherwise the saved `kit.theme-mode`,
      otherwise the OS. Keep the three in step.
      An embedded page also paints the docs picker's live theme, cached in sessionStorage by the docs site
      (same origin); the checks and the selectors mirror lib/embed-theme.ts.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var params = new URLSearchParams(location.search);
          var mode = params.get('theme');
          if (mode !== 'light' && mode !== 'dark') {
            mode = params.get('embed') === '1' ? null : localStorage.getItem('kit.theme-mode');
          }
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var cached = params.get('embed') === '1' && JSON.parse(sessionStorage.getItem('kit.embed.tokens') || 'null');
          var vars = cached && cached.code && cached.mobile && cached.mobile.vars;
          if (vars) {
            var block = function (selector, map) {
              var css = '';
              for (var name in map || {}) {
                var value = String(map[name]);
                if (/^--[a-z0-9-]{1,40}$/.test(name) && /^[\w.%\s(),#/-]{1,80}$/.test(value) && !/url/i.test(value)) {
                  css += name + ':' + value + ';';
                }
              }
              return selector + '{' + css + '}';
            };
            // TYPE_RULES in lib/embed-theme.ts: the text classes follow the live typeset.
            var typeRules = function () {
              var sizes = [['xs', 0.75, 1], ['sm', 0.875, 1.25], ['base', 1, 1.5], ['lg', 1.125, 1.75], ['xl', 1.25, 1.75], ['2xl', 1.5, 2], ['3xl', 1.875, 2.25], ['4xl', 2.25, 2.5]];
              var css = '';
              for (var i = 0; i < sizes.length; i++) {
                var c = '.text-' + sizes[i][0];
                css += c + c + '{font-size:calc(' + sizes[i][1] + 'rem*var(--type-scale))}' +
                  c + ':not([class*="leading-"]){line-height:calc(' + sizes[i][2] + 'rem*var(--type-scale)*var(--leading-factor))}';
              }
              return css +
                '.leading-prose.leading-prose{line-height:calc(1rem*var(--type-scale)*var(--typeset-leading))}' +
                '.gap-flow.gap-flow,.max-w-measure.max-w-measure{font-size:calc(1rem*var(--type-scale))}' +
                '.gap-flow.gap-flow{gap:var(--typeset-flow)}.max-w-measure.max-w-measure{max-width:var(--typeset-measure)}';
            };
            var style = document.createElement('style');
            style.id = 'kit-theme-override';
            style.textContent =
              block(':root:root:root', vars.light) +
              block('.dark:root:root:root', vars.dark) +
              (vars.light && vars.light['--shadow-1']
                ? '.shadow-xs,.shadow-sm,.shadow{--tw-shadow:var(--shadow-1)!important}' +
                  '.shadow-md{--tw-shadow:var(--shadow-2)!important}' +
                  '.shadow-lg,.shadow-xl,.shadow-2xl{--tw-shadow:var(--shadow-3)!important}'
                : '') +
              (vars.light && vars.light['--type-scale'] ? typeRules() : '');
            document.head.appendChild(style);
          }
        } catch (e) {
          /* storage or matchMedia unavailable: the app sets the theme when it mounts */
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
